services:
  domain-expiry:
    container_name: domain-expiry
    build: .
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "2031:8000"
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
        ]
      interval: 60s
      timeout: 5s
      retries: 3
    network_mode: bridge