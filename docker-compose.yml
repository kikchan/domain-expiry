services:
  domain-expiry:
    container_name: domain-expiry
    build: .
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "2031:8000"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3